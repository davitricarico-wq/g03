<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a3d62" />
    <title>GeoRisco offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1d2b3a;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        background: #ffffff;
        border: 1px solid #dfe4ec;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 10px 26px rgba(10, 61, 98, 0.14);
      }

      h1 {
        margin: 0 0 10px;
        color: #0a3d62;
        font-size: 1.4rem;
      }

      p {
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GeoRisco offline</h1>
      <p>Abra novamente uma tela visitada ou conecte-se à internet para carregar novos dados.</p>
    </main>
  </body>
</html>
