stages:
  - test
  - build

image: node:20-bookworm

backend:test:
  stage: test
  cache:
    key:
      files:
        - src/geoRisco/package-lock.json
    paths:
      - src/geoRisco/.npm/
  script:
    - cd src/geoRisco
    - npm ci --cache .npm --prefer-offline --no-audit
    - npm test

backend:integration:
  stage: test
  image: node:20-bookworm
  services:
    - name: postgres:14
      alias: db
  variables:
    DATABASE_URL: "postgresql://postgres:postgres@db:5432/postgres"
    RUN_DB_TESTS: "true"
  before_script:
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h db -p 5432; do echo "waiting for db"; sleep 1; done
  cache:
    key:
      files:
        - src/geoRisco/package-lock.json
    paths:
      - src/geoRisco/.npm/
  script:
    - cd src/geoRisco
    - npm ci --cache .npm --prefer-offline --no-audit
    - npm run migrate
    - npm run test:coverage:integration
  artifacts:
    when: always
    reports:
      junit: src/geoRisco/coverage/junit.xml
    paths:
      - src/geoRisco/coverage/

backend:build:
  stage: build
  cache:
    key:
      files:
        - src/geoRisco/package-lock.json
    paths:
      - src/geoRisco/.npm/
  script:
    - cd src/geoRisco
    - npm ci --cache .npm --prefer-offline --no-audit
    - npm run build
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - src/geoRisco/dist/

frontend:build:
  stage: build
  cache:
    key:
      files:
        - src/frontend/package-lock.json
    paths:
      - src/frontend/.npm/
  script:
    - cd src/frontend
    - npm ci --cache .npm --prefer-offline --no-audit
    - npm run build
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - src/frontend/dist/

# Publica o frontend no GitLab Pages. Requer a variável de CI/CD
# VITE_API_BASE_URL = https://<projeto>.vercel.app/api (URL do backend na Vercel).
pages:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  cache:
    key:
      files:
        - src/frontend/package-lock.json
    paths:
      - src/frontend/.npm/
  script:
    - cd src/frontend
    - npm ci --cache .npm --prefer-offline --no-audit
    # base do Vite = caminho da URL do Pages (assets resolvem sob o subcaminho)
    - export VITE_BASE_PATH="$(node -e "let p=new URL(process.env.CI_PAGES_URL).pathname; if(!p.endsWith('/'))p+='/'; process.stdout.write(p)")"
    - echo "VITE_BASE_PATH=$VITE_BASE_PATH | VITE_API_BASE_URL=$VITE_API_BASE_URL"
    - npm run build
    - cp dist/index.html dist/404.html   # fallback de SPA (BrowserRouter) em deep links
    - cd ../..
    - rm -rf public
    - cp -r src/frontend/dist public      # Pages publica o diretório chamado "public"
  artifacts:
    paths:
      - public